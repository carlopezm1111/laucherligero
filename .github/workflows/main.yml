name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto más reciente
        shell: bash
        run: |
          mapfile -t archivos < <(find . -maxdepth 1 -type f -name 'ligero-proyecto-android*.zip' -printf '%f\n' | sort -V)
          if (( ${#archivos[@]} == 0 )); then
            echo "::error::No se encontró ningún archivo ligero-proyecto-android*.zip"
            exit 1
          fi
          archivo="${archivos[${#archivos[@]}-1]}"
          echo "Proyecto seleccionado: $archivo"
          unzip -q "$archivo"
          if [[ ! -d optimizador ]]; then
            echo "::error::El ZIP no contiene la carpeta optimizador esperada"
            exit 1
          fi

      - name: Corregir conflictos de nombres Kotlin del proyecto importado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("optimizador/app/src/main")
          names = ["UltraLight", "AutoUpdate", "NoAnim", "City", "TextMode", "ServerUrl"]
          methods = {f"set{name}": f"update{name}" for name in names}
          files = sorted([*src.rglob("*.kt"), *src.rglob("*.java")])
          definitions = {name: 0 for name in methods}
          if not files:
              raise SystemExit("No se encontraron fuentes Kotlin/Java en el ZIP")
          for file in files:
              before = file.read_text(encoding="utf-8")
              after = before
              for old, new in methods.items():
                  if file.suffix == ".kt":
                      definitions[old] += len(re.findall(r"\bfun\s+" + old + r"\s*\(", before))
                  after = re.sub(r"\b" + old + r"(?=\s*\()", new, after)
              if after != before:
                  file.write_text(after, encoding="utf-8")
                  print(f"Actualizado: {file}")
          missing = [name for name, count in definitions.items() if count == 0]
          if missing:
              raise SystemExit("Faltan funciones esperadas: " + ", ".join(missing))
          print("Colisiones Kotlin corregidas:", ", ".join(methods))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        working-directory: optimizador
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ligero-apk
          path: optimizador/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK con enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ligero v0.1.${{ github.run_number }} (prueba)
          files: optimizador/app/build/outputs/apk/debug/app-debug.apk
