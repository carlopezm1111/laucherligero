name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto más reciente
        shell: bash
        run: |
          mapfile -t archivos < <(find . -maxdepth 1 -type f -name 'ligero-proyecto-android*.zip' -printf '%f\n' | sort -V)
          if (( ${#archivos[@]} == 0 )); then
            echo "::error::No se encontró ningún archivo ligero-proyecto-android*.zip"
            exit 1
          fi
          archivo="${archivos[${#archivos[@]}-1]}"
          echo "Proyecto seleccionado: $archivo"
          unzip -q "$archivo"
          if [[ ! -d optimizador ]]; then
            echo "::error::El ZIP no contiene la carpeta optimizador esperada"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        working-directory: optimizador
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ligero-apk
          path: optimizador/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK con enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ligero v0.1.${{ github.run_number }} (prueba)
          files: optimizador/app/build/outputs/apk/debug/app-debug.apk
